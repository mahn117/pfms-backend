name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://pfms_ci:pfms_ci_test@127.0.0.1:5432/pfms_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_ACCESS_SECRET: ci-only-access-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      OTP_DELIVERY_PROVIDER: smtp
      MAIL_HOST: smtp.invalid
      MAIL_PORT: '587'
      MAIL_FROM: no-reply@example.com
      MAIL_SECURE: 'false'
      MAIL_CONNECTION_TIMEOUT_MS: '10000'
      UPLOAD_STORAGE: local
      UPLOAD_MAX_SIZE_MB: '5'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pfms_ci
          POSTGRES_PASSWORD: pfms_ci_test
          POSTGRES_DB: pfms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pfms_ci -d pfms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply test database migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint:check
      - name: Unit tests
        run: npm run test -- --runInBand
      - name: E2E tests
        run: npm run test:e2e -- --runInBand
      - name: Coverage gate
        run: npm run test:cov
      - name: Build
        run: npm run build
